apiVersion: specialized-harness/v1
kind: Blueprint
metadata:
  name: standard-coding
  description: Governed implementation under explicit authority
  version: "1.1.0"
spec:
  policy:
    max_ci_rounds: 2
    max_agentic_recovery_attempts: 1
    max_net_loc: 1000
    max_tool_rounds: 8
    require_trajectory: true
    require_authority_resolution: true
  nodes:
    - id: resolve_authority
      type: deterministic
      handler: resolve_authority
    - id: constrain_scope
      type: deterministic
      handler: constrain_scope
    - id: provision
      type: deterministic
      handler: provision_sandbox
    - id: plan
      type: agentic
      handler: plan
    - id: implement
      type: agentic
      handler: implement
    - id: local_verify
      type: deterministic
      handler: run_local_verification
    - id: push
      type: deterministic
      handler: git_push
    - id: ci_round
      type: deterministic
      handler: selective_ci_and_verify_outcome
    - id: fix_ci
      type: agentic
      handler: fix_ci_failures
    - id: decide
      type: deterministic
      handler: decide_accept_or_handoff
  edges:
    - from: resolve_authority
      to: constrain_scope
      "on": success
    - from: constrain_scope
      to: provision
      "on": success
    - from: provision
      to: plan
      "on": success
    - from: plan
      to: implement
      "on": success
    - from: implement
      to: local_verify
      "on": success
    - from: local_verify
      to: push
      "on": success
    - from: push
      to: ci_round
      "on": success
    - from: ci_round
      to: decide
      "on": success
    - from: ci_round
      to: fix_ci
      "on": failure
      when: ci_rounds < max_ci_rounds
    - from: fix_ci
      to: ci_round
      "on": success
    - from: ci_round
      to: decide
      "on": failure
      when: ci_rounds >= max_ci_rounds
    - from: resolve_authority
      to: decide
      "on": failure
    - from: implement
      to: decide
      "on": failure
