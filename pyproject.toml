[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specialized-harness"
version = "1.1.0"
description = "Authoritative coding-agent harness — deterministic governance of probabilistic generation"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
specialized-harness = "specialized_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specialized_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
