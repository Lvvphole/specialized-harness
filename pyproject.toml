[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specialized-harness"
version = "1.1.0"
description = "Authoritative coding-agent harness — deterministic governance of probabilistic generation"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[project.scripts]
specialized-harness = "specialized_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specialized_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# A lint gate whose rule set changes when a new ruff is released is not a
# deterministic gate (AGENTS.md invariant 6). The version is pinned in the dev
# extra above; the rule set is declared here rather than inherited from ruff's
# shifting defaults.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Each family is selected because it is enforceable without judgment calls:
#   E4/E7/E9, F  correctness and unused/undefined names
#   I            deterministic import ordering
#   UP           syntax already available on the pinned floor (py311)
#   RUF          ruff-specific checks, including __all__ ordering
# Deliberately not selected: BLE, SIM, TRY. Those require case-by-case rewrites
# of exception handling and control flow, which is a code change, not a gate.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]

# UP042 wants `class X(str, Enum)` rewritten to `enum.StrEnum`. That changes
# `str(member)` from "X.MEMBER" to the member value, and TrajectoryEvent
# .canonical_hash() serializes with `default=str`, so the rewrite would silently
# change persisted trajectory hashes. Excluded until that is handled on purpose.
ignore = ["UP042"]
