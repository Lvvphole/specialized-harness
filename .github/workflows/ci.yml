name: Specialized Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + integration
        run: pytest -v
      - name: Lint
        # ruff is pinned in the dev extra and installed by the step above;
        # the rule set comes from [tool.ruff.lint] in pyproject.toml.
        run: ruff check src tests
