name: Specialized Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  authority-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Authority file presence & constraint tests
        run: pytest tests/unit/test_constraints.py -v
      - name: Lint
        run: ruff check src tests || true
      - name: Type check
        run: mypy src || true
