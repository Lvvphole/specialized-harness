# Compatibility umbrella — unit + integration + offline evals.
# Prefer split workflows for signal clarity. AGENTS.md §8: CI never merges.
name: Specialized Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit
        run: pytest tests/unit -q --tb=line
      - name: Lint
        run: ruff check src tests

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration
        run: pytest tests/integration -q --tb=line

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Offline eval contracts
        run: pytest tests/evals -q -m eval --tb=line
