# Unit tests — TDD red/green floor for library behavior.
# AGENTS.md: CI reports status; only humans merge to main.
name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit suite
        run: pytest tests/unit -v --tb=short
      - name: Lint
        run: ruff check src tests
