# Unit tests — TDD red/green floor for library behavior.
# AGENTS.md: CI reports status; only humans merge to main.
# Tier 0: permissions deny-by-default; SHA-pinned actions; no credential persistence.
name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit suite
        run: pytest tests/unit -v --tb=short
      - name: Lint
        run: ruff check src tests
