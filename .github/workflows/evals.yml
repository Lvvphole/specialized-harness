# Offline evals — AGENTS.md §4 outcome contracts (ACCEPT / HANDOFF / FAILED).
# Seed eval corpus; no live model, no network.
# Tier 0: permissions deny-by-default; SHA-pinned actions; no credential persistence.
name: Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Offline eval contracts
        run: pytest tests/evals -v -m eval --tb=short
      - name: CLI smoke (fixture ACCEPT path)
        run: |
          specialized-harness run fix_add \
            --blueprint blueprints/standard-coding.yaml \
            --fixture-root fixtures \
            --provider scripted \
            --runs-dir /tmp/harness-eval-runs
